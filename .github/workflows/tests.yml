name: Tests

# Laeuft bei jedem Push auf jeden Branch und bei jedem Pull Request nach main.
# Die Testreihe ist auf acht GitHub-Rechner verteilt (gleiche Tests, nur parallel, siehe tests/ci_shards.py). Der Job «abdeckung» stellt sicher,
# dass kein Test verloren geht. Der Auswertungs-Job «tests» ist nur gruen, wenn alle Teile und die Abdeckung gruen sind; sein Name bleibt gleich,
# damit bestehende Regeln und das automatische Zusammenfuehren weiter greifen.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  abdeckung:
    name: abdeckung
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Jeder Test laeuft in genau einem Teil
        run: python tests/ci_shards.py check

  teil:
    name: teil (${{ matrix.teil }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        teil: [handy-hell, handy-dunkel, breite-1, breite-2, layout, allgemein-1, allgemein-2, allgemein-3, allgemein-4, allgemein-5, allgemein-6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle Historie: Datenerhalt-Test und Handy-Vergleich brauchen fruehere Commits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - name: Abhaengigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm ci
          pip install -r tests/requirements.txt
          playwright install --with-deps chromium
      - name: Tests ausfuehren
        run: |
          BEFEHL="$(python tests/ci_shards.py cmd ${{ matrix.teil }})"
          echo "$BEFEHL"
          eval "$BEFEHL"

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: [teil, abdeckung]
    if: always()
    steps:
      - name: Alles gruen?
        run: test "${{ needs.teil.result }}" = "success" && test "${{ needs.abdeckung.result }}" = "success"
