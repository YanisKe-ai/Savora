name: CI-Diagnose (temporaer)

# Temporaer: nur die vier Tests, die in der Linux-Umgebung abwichen. Wird vor dem Merge wieder entfernt.
on:
  push:
    branches: [paket-37-umbau]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhaengigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm ci
          pip install -r tests/requirements.txt
          playwright install --with-deps chromium
      - name: Vier Tests
        run: python tests/run_all.py sync paket3 paket8 paket37_adapt
