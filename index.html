<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savora · Dein Kochbuch</title>
<meta name="description" content="Savora, dein persönliches digitales Kochbuch">
<meta name="theme-color" content="#16261c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* ============ FARB-TOKENS (Rohwerte) ============ */
    --forest-950: #0f1a13;
    --forest-900: #16261c;
    --forest-850: #1c3325;
    --forest-800-elevated: #24402e;
    --forest-800: #203327;
    --forest-700: #2c4534;
    --forest-600: #3d5c46;
    --sage-400: #8fa88c;
    --sage-300: #b3c4ac;
    --cream-50: #faf7ee;
    --cream-100: #f5efdf;
    --cream-200: #ece2c8;
    --ember-500: #c9832f;
    --ember-400: #d99a49;
    --ember-400-dark: #d69a52;
    --ember-600: #a8681f;
    --ember-700: #98601c;
    --ember-100: #f2ddb8;
    --ink: #1b2118;

    --success: #3f7d4e;
    --success-300: #7cc08a;
    --warning: #d99a49;
    --danger: #a2432f;
    --danger-300: #d98166;
    --info: #4a7d78;

    /* ============ SEMANTISCHE TOKENS — LIGHT (Standard) ============ */
    --bg: var(--cream-50);
    --bg-elevated: var(--cream-100);
    --bg-sunken: var(--cream-200);
    --bg-level2: #ffffff;
    --text: var(--ink);
    --text-muted: var(--forest-600);
    --brand: var(--forest-900);
    --brand-ink: var(--cream-100);
    --accent: var(--ember-700);
    --accent-solid: var(--ember-400);
    --accent-icon: var(--ember-600);
    --on-accent: var(--forest-950);
    --border: rgba(61,92,70,0.22);
    --focus-ring: var(--ember-400);
    --card-bg: #ffffff;
    --shadow-card: 0 1px 2px rgba(15,26,19,0.06), 0 6px 18px rgba(15,26,19,0.08);
    --shadow-soft: 0 2px 8px rgba(15,26,19,0.08), 0 8px 24px rgba(15,26,19,0.06);

    /* ============ TYPOGRAFIE ============ */
    --font-display: 'Baloo 2', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-sans: 'Baloo 2', 'Segoe UI', system-ui, -apple-system, sans-serif;

    --fs-brand: 2rem;
    --fs-title-lg: 1.75rem;
    --fs-title-md: 1.25rem;
    --fs-cook-step: 1.4rem;
    --fs-body: 1rem;
    --fs-label: 0.8125rem;

    --radius-s: 10px;
    --radius-m: 14px;
    --radius-l: 24px;
    --tap-min: 48px;
    --tap-primary: 56px;
  }

  [data-theme="dark"] {
    --bg: var(--forest-950);
    --bg-elevated: var(--forest-850);
    --bg-sunken: #0c1410;
    --bg-level2: var(--forest-800-elevated);
    --text: #f0ece0;
    --text-muted: var(--sage-300);
    --brand: #f0ece0;
    --brand-ink: var(--forest-900);
    --accent: var(--ember-400);
    --accent-solid: var(--ember-400-dark);
    --accent-icon: var(--ember-400);
    --on-accent: var(--forest-950);
    --border: rgba(179,196,172,0.20);
    --card-bg: var(--forest-850);
    --success: var(--success-300);
    --danger: var(--danger-300);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    --shadow-soft: 0 2px 8px rgba(0,0,0,0.4);
  }

  /* True-Black/AMOLED: reines Schwarz für Akku auf OLED-Bildschirmen, sonst wie Dark Mode */
  [data-theme="amoled"] {
    --bg: #000000;
    --bg-elevated: #121212;
    --bg-sunken: #000000;
    --bg-level2: #1c1c1c;
    --text: #f0ece0;
    --text-muted: var(--sage-300);
    --brand: #f0ece0;
    --brand-ink: #121212;
    --accent: var(--ember-400);
    --accent-solid: var(--ember-400-dark);
    --accent-icon: var(--ember-400);
    --on-accent: #000000;
    --border: rgba(179,196,172,0.18);
    --card-bg: #121212;
    --success: var(--success-300);
    --danger: var(--danger-300);
    --shadow-card: none;
    --shadow-soft: none;
  }

  * { box-sizing: border-box; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  /* Sicherheitsnetz: jedes Icon-SVG ohne spezifischere Grössen-Regel bekommt eine
     vernünftige Default-Grösse relativ zur Schrift, statt auf den SVG-Standard
     (300x150) zurückzufallen, sobald der umgebende Button/Container keine feste
     Breite erzwingt. Spezifischere Klassen-Regeln (z.B. .fab svg) überstimmen dies. */
  svg { width: 1em; height: 1em; flex-shrink: 0; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    font-optical-sizing: auto;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  /* ---------- App shell ---------- */
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- View Transitions: sanfte Übergänge zwischen Screens ---------- */
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 240ms;
    animation-timing-function: cubic-bezier(.4,0,.2,1);
  }
  /* Während des Theme-Wechsels übernimmt der Kreis-Reveal die Kontrolle über
     ::view-transition-new(root) — der normale Crossfade wird dafür deaktiviert. */
  :root.theme-transitioning::view-transition-old(root),
  :root.theme-transitioning::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
  }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  }

  /* ---------- Splash / Öffnungs-Übergang ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--forest-900);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: background-color 0.5s ease 0.12s;
  }
  #splash.hide { background-color: transparent; pointer-events: none; }
  #splashLogo {
    width: 108px; height: 108px; border-radius: 26px;
    object-fit: cover; overflow: hidden; display: block;
    box-shadow: 0 16px 44px rgba(0,0,0,0.35);
    transition: transform 0.68s cubic-bezier(.65,0,.35,1), border-radius 0.68s cubic-bezier(.65,0,.35,1);
    will-change: transform;
  }
  .splash-word {
    margin-top: 16px; font-family: var(--font-display); font-size: 26px; font-weight: 800;
    color: var(--cream-50); letter-spacing: 0.01em;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.4s ease 0.1s, transform 0.4s ease 0.1s;
  }
  .splash-word.show { opacity: 1; transform: translateY(0); }
  #splash.hide .splash-word { opacity: 0; transition: opacity 0.25s ease; }

  .topbar {
    background: var(--forest-900);
    color: var(--cream-100);
    padding: clamp(14px, 2.4vh, 22px) clamp(16px, 4vw, 32px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; display: block; }
  .brand-name {
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-size: var(--fs-brand);
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; overflow: hidden; }
  .topbar-title {
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-size: 18px;
    font-weight: 600;
    color: var(--cream-100);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .topbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  .icon-btn {
    background: transparent;
    border: 1px solid rgba(245,239,223,0.28);
    color: var(--cream-100);
    border-radius: var(--radius-s);
    width: var(--tap-min); height: var(--tap-min);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn:hover { background: rgba(245,239,223,0.12); border-color: rgba(245,239,223,0.5); }
  .icon-btn svg { width: 19px; height: 19px; }

  main { flex: 1; padding: clamp(16px, 3vh, 32px) clamp(16px, 4vw, 32px) 32px; max-width: 1100px; margin: 0 auto; width: 100%; }
  main.has-tabbar { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0)); }

  /* ---------- Home / search / filters ---------- */
  .search-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .search-input-wrap { position: relative; flex: 1; }
  .search-input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); }
  .search-input {
    width: 100%;
    padding: 12px 14px 12px 38px;
    border-radius: var(--radius-m);
    border: 1px solid var(--border);
    background: var(--card-bg);
    font-size: 16px;
    color: var(--text);
  }
  .search-input:focus { outline: none; border-color: var(--accent-solid); box-shadow: 0 0 0 3px rgba(201,131,47,0.15); }

  .tag-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
  .tag-row::-webkit-scrollbar { display: none; }
  .tag-chip {
    flex-shrink: 0;
    padding: 8px 14px;
    min-height: 38px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .tag-chip.active { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: clamp(10px, 2vw, 18px);
  }
  .recipe-card {
    background: var(--card-bg);
    border-radius: var(--radius-m);
    overflow: hidden;
    box-shadow: var(--shadow-card);
    position: relative;
    text-align: left;
    border: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .recipe-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
  .recipe-card--featured { grid-column: 1 / -1; flex-direction: row; }
  .recipe-card--featured .recipe-card-img { width: 42%; aspect-ratio: auto; flex-shrink: 0; }
  .recipe-card--featured .recipe-card-body { justify-content: center; }
  .recipe-card--featured .recipe-card-title { font-size: 1.4rem; }
  .recipe-card-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
  .recipe-card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--cream-200); }
  .recipe-card-img.placeholder { display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
  .recipe-card-img.placeholder svg { width: 34px; height: 34px; }
  .recipe-card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .recipe-card-title { font-family: var(--font-display); font-optical-sizing: auto; font-size: var(--fs-title-md); font-weight: 600; line-height: 1.2; color: var(--text); }
  .recipe-card-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; font-variant-numeric: tabular-nums; }
  .fav-btn {
    position: absolute; top: 8px; right: 8px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: none;
    display: flex; align-items: center; justify-content: center;
  }
  .fav-btn svg { width: 16px; height: 16px; color: var(--ember-600); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state > svg { width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 12px; }
  .empty-state h2 { font-family: var(--font-display); color: var(--text); margin: 0 0 6px; font-size: 20px; }
  .empty-state p { margin: 0 0 18px; font-size: 14px; }

  .primary-btn {
    background: linear-gradient(135deg, var(--ember-400), var(--ember-500));
    color: var(--on-accent);
    border: none;
    padding: 12px 22px;
    min-height: var(--tap-primary);
    border-radius: 999px;
    font-size: 15.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 3px 10px rgba(201,131,47,0.28);
  }
  .primary-btn svg { width: 17px; height: 17px; }
  .primary-btn:active { transform: scale(0.98); }
  .ghost-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 11px 20px;
    min-height: var(--tap-min);
    border-radius: 999px;
    font-size: 14.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .ghost-btn svg { width: 16px; height: 16px; }
  .danger-btn { color: var(--danger); border-color: rgba(162,67,47,0.3); }

  .fab {
    position: fixed;
    right: clamp(16px, 4vw, 32px);
    bottom: calc(64px + clamp(12px, 3vh, 24px) + env(safe-area-inset-bottom, 0));
    width: 60px; height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ember-400), var(--ember-500));
    color: var(--on-accent);
    border: none;
    box-shadow: 0 6px 18px rgba(201,131,47,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 15;
    transition: transform 0.15s ease;
  }
  .fab:active { transform: scale(0.94); }
  .fab svg { width: 25px; height: 25px; }

  /* ---------- Recipe detail ---------- */
  .detail-hero {
    position: relative;
    border-radius: var(--radius-l);
    overflow: hidden;
    background: var(--forest-800);
    margin-bottom: 18px;
  }
  .detail-hero-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .detail-hero-img.placeholder { display: flex; align-items: center; justify-content: center; color: var(--sage-300); }
  .detail-hero-img.placeholder svg { width: 56px; height: 56px; }
  .detail-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(15,26,19,0.85) 0%, rgba(15,26,19,0.12) 55%, transparent 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 20px;
  }
  .detail-title { font-family: var(--font-display); font-optical-sizing: auto; font-size: clamp(24px, 4vw, 34px); color: var(--cream-50); font-weight: 600; margin: 0 0 6px; }
  .detail-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--cream-200); font-size: 13px; font-variant-numeric: tabular-nums; }
  .detail-meta span { display: flex; align-items: center; gap: 5px; }
  .detail-meta svg { width: 14px; height: 14px; }

  .detail-actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .detail-icon-action {
    flex-shrink: 0; width: var(--tap-primary); height: var(--tap-primary);
    border-radius: 999px; border: 1.5px solid var(--border); background: var(--card-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .detail-icon-action svg { width: 20px; height: 20px; }

  .source-line { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
  .source-line svg { width: 13px; height: 13px; }
  .source-line a { text-decoration: underline; color: var(--accent); }

  .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .detail-tags .tag-chip { cursor: default; }

  /* ---------- Diet / allergen badges ---------- */
  .diet-badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .diet-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .diet-badge svg { width: 13px; height: 13px; }
  .diet-badge.tone-diet { background: rgba(63,125,78,0.14); color: var(--success); }
  .diet-badge.tone-free { background: rgba(74,125,120,0.14); color: var(--info); }
  .diet-select-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .diet-select-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 13px; min-height: 40px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted);
    font-size: 13px;
  }
  .diet-select-chip svg { width: 14px; height: 14px; }
  .diet-select-chip.active { border-color: var(--success); background: rgba(63,125,78,0.12); color: var(--success); font-weight: 600; }

  /* ---------- Timer chips (Kochmodus) ---------- */
  .timer-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(217,154,73,0.16); color: var(--ember-400);
    border: 1px solid rgba(217,154,73,0.35);
    border-radius: 999px; padding: 4px 11px 4px 9px; margin: 0 2px;
    font-family: var(--font-sans); font-size: 0.62em; font-weight: 700;
    font-variant-numeric: tabular-nums; vertical-align: middle;
    min-height: 32px;
  }
  .timer-chip svg { width: 13px; height: 13px; flex-shrink: 0; }
  .timer-chip.running { background: rgba(217,154,73,0.28); }
  .timer-chip.done { background: rgba(63,125,78,0.22); color: var(--success-300); border-color: rgba(124,192,138,0.4); }

  /* ---------- Shopping list ---------- */
  .shopping-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 4px; border-bottom: 1px solid var(--border);
  }
  .shopping-check {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--card-bg);
    display: flex; align-items: center; justify-content: center; color: var(--success);
  }
  .shopping-check.checked { background: var(--success); border-color: var(--success); color: #fff; }
  .shopping-check svg { width: 15px; height: 15px; }
  .shopping-item-text { flex: 1; font-size: 15px; }
  .shopping-item.checked .shopping-item-text { text-decoration: line-through; color: var(--text-muted); }
  .shopping-item-amount { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 4px; }
  .shopping-group-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin: 20px 0 4px; }
  .shopping-item-del { flex-shrink: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: none; border: none; }
  .shopping-item-del svg { width: 15px; height: 15px; }
  .cart-badge {
    position: absolute; top: -3px; right: -3px; background: var(--ember-400); color: var(--forest-950);
    font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }

  /* ---------- Meal plan ---------- */
  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 8px; }
  .week-nav-label { font-family: var(--font-display); font-optical-sizing: auto; font-size: 16px; color: var(--text); text-align: center; flex: 1; }
  .week-nav button { width: 40px; height: 40px; border-radius: var(--radius-s); border: 1px solid var(--border); background: var(--card-bg); color: var(--text); display: flex; align-items: center; justify-content: center; }
  .day-card { background: var(--card-bg); border-radius: var(--radius-m); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow-card); }
  .day-card.is-today { border: 1.5px solid var(--accent-solid); }
  .day-card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .day-card-title { font-family: var(--font-display); font-optical-sizing: auto; font-size: 16px; color: var(--text); }
  .day-card-date { font-size: 12px; color: var(--text-muted); }
  .day-recipe-chip { display: flex; align-items: center; gap: 8px; background: var(--bg-elevated); border-radius: var(--radius-s); padding: 8px 10px; margin-bottom: 6px; font-size: 13.5px; }
  .day-recipe-chip span { flex: 1; }

/* ---------- IndexedDB layer ---------- */
const DB_NAME = 'savora-db';
const DB_VERSION = 3;
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB wird von diesem Browser nicht unterstützt.')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('recipes')) {
        const store = db.createObjectStore('recipes', { keyPath: 'id' });
        store.createIndex('updatedAt', 'updatedAt');
      }
      if (!db.objectStoreNames.contains('shopping')) {
        db.createObjectStore('shopping', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('mealplan')) {
        db.createObjectStore('mealplan', { keyPath: 'date' });
      }
    };
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => {
        // Ein anderer Tab/Fenster fuehrt ein DB-Upgrade durch — diese Verbindung schliessen,
        // damit das Upgrade dort nicht haengen bleibt (verhindert stillen Deadlock).
        db.close();
        dbPromise = null;
      };
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB konnte nicht geöffnet werden.'));
    req.onblocked = () => reject(new Error('Datenbank-Update blockiert — bitte alle anderen Savora-Tabs/-Fenster schliessen und neu laden.'));
  });
  return dbPromise;
}

/* ---------- Konservativer Namensabgleich fuer die Einkaufsliste (Singular/Plural) ---------- */
function isSimpleGermanPluralPair(a, b) {
  // Deckt genau die haeufigen Faelle ab (Tomate/Tomaten, Zwiebel/Zwiebeln) ohne
  // generisches Wortstamm-Raten, das faelschlich unterschiedliche Zutaten verschmelzen koennte.
  return a + 'n' === b || a + 'en' === b || b + 'n' === a || b + 'en' === a;
}
function ingredientNamesMatch(nameA, nameB) {
  const a = (nameA || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const b = (nameB || '').trim().toLowerCase().replace(/\s+/g, ' ');
  if (!a || !b) return false;
  if (a === b) return true;
  return isSimpleGermanPluralPair(a, b);
}

async function addRecipeIngredientsToShopping(r, servings) {
  const factor = servings / (r.servings || 1);
  for (const ing of (r.ingredients || [])) {
    if (!ing.name) continue;
    const parsedAmt = parseAmount(ing.amount);
    const scaledAmount = parsedAmt !== null ? Math.round(parsedAmt * factor * 100) / 100 : '';
    const match = state.shopping.find(s => !s.checked && ingredientNamesMatch(s.name, ing.name) && (s.unit || '') === (ing.unit || ''));
    if (match && typeof scaledAmount === 'number' && typeof match.amount === 'number') {
      match.amount = Math.round((match.amount + scaledAmount) * 100) / 100;
      await dbPutShopping(match);
    } else {
      const item = { id: uid(), name: ing.name, amount: scaledAmount, unit: ing.unit || '', checked: false, recipeId: r.id, createdAt: Date.now() };
      await dbPutShopping(item);
      state.shopping.push(item);
    }
  }
}

/* ---------- Helpers ---------- */
function uid() { return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtAmount(n) {
  if (n === null || n === undefined || n === '') return '';
  const rounded = Math.round(n * 100) / 100;
  if (Number.isInteger(rounded)) return String(rounded);
  const frac = { 0.25: '¼', 0.5: '½', 0.75: '¾', 0.33: '⅓', 0.67: '⅔' };
  const whole = Math.floor(rounded);
  const rem = Math.round((rounded - whole) * 100) / 100;
  const closest = Object.keys(frac).map(Number).reduce((a, b) => Math.abs(b - rem) < Math.abs(a - rem) ? b : a, 1);
  if (Math.abs(closest - rem) < 0.06) return (whole > 0 ? whole + ' ' : '') + frac[closest];
  return String(rounded);
}

/* ---------- Zentraler Mengen-Parser: verhindert NaN bei Bruechen/Komma ---------- */
const UNICODE_FRACTIONS = { '¼': 0.25, '½': 0.5, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3, '⅕': 0.2, '⅖': 0.4, '⅗': 0.6, '⅘': 0.8, '⅛': 0.125, '⅜': 0.375, '⅝': 0.625, '⅞': 0.875 };
function parseFractionPart(s) {
  if (UNICODE_FRACTIONS[s] !== undefined) return UNICODE_FRACTIONS[s];
  const m = /^(\d+)\/(\d+)$/.exec(s);
  if (m) {
    const num = parseInt(m[1], 10), den = parseInt(m[2], 10);
    return den === 0 ? null : num / den;
  }
  return null;
}
function parseAmount(raw) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (typeof raw === 'number') return isNaN(raw) ? null : raw;
  const s = String(raw).trim();
  if (!s) return null;
  const mixed = /^(\d+)\s+(\d+\/\d+|[¼½¾⅓⅔⅕⅖⅗⅘⅛⅜⅝⅞])$/.exec(s);
  if (mixed) {
    const frac = parseFractionPart(mixed[2]);
    return frac === null ? null : parseInt(mixed[1], 10) + frac;
  }
  const fracOnly = parseFractionPart(s);
  if (fracOnly !== null) return fracOnly;
  const num = parseFloat(s.replace(',', '.'));
  return isNaN(num) ? null : num;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function compressImage(dataUrl, maxW = 1200, quality = 0.82) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function domainFromUrl(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; }
}

function normalizeUnit(raw) {

  if (targetSystem === 'imperial' && IMPERIAL_UNITS.has(canonicalUnit)) return null;
  if (!METRIC_UNITS.has(canonicalUnit) && !IMPERIAL_UNITS.has(canonicalUnit)) return null; // TL/EL bleiben unangetastet

  const candidates = dim === 'weight'
    ? (targetSystem === 'metric' ? ['kg', 'g'] : ['lb', 'oz'])
    : (targetSystem === 'metric' ? ['l', 'ml'] : ['cup', 'floz']);
  for (const u of candidates) {
    const val = base / table[u];
    if (val >= 1) return { amount: roundNice(val), unit: u };
  }
  const last = candidates[candidates.length - 1];
  return { amount: roundNice(base / table[last]), unit: last };
}
function convertAmountExplicit(amount, fromCanonical, toCanonical) {
  const dimFrom = unitDimension(fromCanonical), dimTo = unitDimension(toCanonical);
  if (!dimFrom || dimFrom !== dimTo) return null;
  const table = dimFrom === 'weight' ? WEIGHT_TABLE : VOLUME_TABLE;
  return roundNice((amount * table[fromCanonical]) / table[toCanonical]);
}
function autoConvertIngredient(ing) {
  const amt = parseAmount(ing.amount);
  const canonical = normalizeUnit(ing.unit);
  if (amt === null || isNaN(amt) || !canonical) return ing;
  const result = convertToSystem(amt, canonical, state.unitSystem);
  if (!result) return ing;
  return { ...ing, amount: result.amount, unit: UNIT_LABELS[result.unit] };
}

/* ---------- Timer parsing for cook mode ---------- */
/* ---------- Zentraler Dauer-Parser (Zeitspannen, Sekunden, Dezimalstunden) ---------- */
function durationUnitSeconds(unit) {
  if (/^(Stunden?|Std\.?|h)$/i.test(unit)) return 3600;
  if (/^(Sekunden?|Sek\.?|s)$/i.test(unit)) return 1;
  return 60; // Minuten
}
function parseDurations(text) {
  const re = /(\d+(?:[.,]\d+)?)\s*(?:(?:bis|-|–|—)\s*(\d+(?:[.,]\d+)?)\s*)?(Stunden?|Std\.?|Minuten?|Min\.?|Sekunden?|Sek\.?|h)\b/gi;
  const results = [];
  let m;
  while ((m = re.exec(text)) !== null) {
    const mult = durationUnitSeconds(m[3]);
    const n1 = parseFloat(m[1].replace(',', '.'));
    const n2 = m[2] ? parseFloat(m[2].replace(',', '.')) : null;
    if (isNaN(n1)) continue;
    const minSeconds = Math.round(n1 * mult);
    const maxSeconds = n2 !== null && !isNaN(n2) ? Math.round(n2 * mult) : minSeconds;
    results.push({
      raw: m[0], index: m.index, length: m[0].length,
      seconds: maxSeconds, // bei Zeitspannen wird der obere Wert vorgeschlagen
      minSeconds, maxSeconds,
      confidence: n2 !== null ? 'range' : 'exact',
    });
  }
  return results;
}
function parseStepSegments(text) {
  const durations = parseDurations(text);
  const segments = [];
  let last = 0, i = 0;
  for (const d of durations) {
    if (d.index > last) segments.push({ type: 'text', value: text.slice(last, d.index) });
    segments.push({ type: 'timer', value: d.raw, seconds: d.seconds, key: 'seg' + (i++) });
    last = d.index + d.length;
  }
  if (last < text.length) segments.push({ type: 'text', value: text.slice(last) });
  return segments;
}
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function renderStepWithTimers(text, stepIdx) {
  const segments = parseStepSegments(text);
  return segments.map(seg => {
    if (seg.type === 'text') return escapeHtml(seg.value);
    const id = `${state.activeRecipeId}-${stepIdx}-${seg.key}`;
    const t = state.timers[id];
    const label = t ? fmtClock(t.remaining) : seg.value;
    const cls = t && t.done ? 'done' : (t && t.running ? 'running' : '');
    return `<button type="button" class="timer-chip ${cls}" data-timer-id="${id}" data-seconds="${seg.seconds}" data-action="toggle-timer" aria-label="${t && t.done ? 'Timer fertig' : t && t.running ? 'Timer läuft, ' + fmtClock(t.remaining) + ' verbleiben' : 'Timer starten, ' + fmtClock(seg.seconds)}">${t && t.done ? ICONS.check : ICONS.timer}<span data-timer-label="${id}">${label}</span></button>`;
  }).join('');
}

function startTimer(id, totalSeconds) {
  if (state.timers[id] && state.timers[id].running) return;
  const existing = state.timers[id];
  if (existing && existing.intervalId) clearInterval(existing.intervalId);
  const remainingSeconds = existing ? existing.remaining : totalSeconds;
  const t = {
    remaining: remainingSeconds,
    total: totalSeconds,
    endTime: Date.now() + remainingSeconds * 1000, // Zeitquelle: absolute Endzeit, nicht Herunterzaehlen
    running: true,
    done: false,
    intervalId: null,
  };
  state.timers[id] = t;
  t.intervalId = setInterval(() => tickTimer(id), 1000);
  updateTimerChipDOM(id);
}
function tickTimer(id) {
  const t = state.timers[id];
  if (!t || !t.running) return;
  t.remaining = Math.max(0, Math.round((t.endTime - Date.now()) / 1000));
  if (t.remaining <= 0) {
    t.remaining = 0;
    t.running = false;
    t.done = true;
    clearInterval(t.intervalId);
    t.intervalId = null;
    finishTimerFeedback();
  }
  updateTimerChipDOM(id);
}
function resyncRunningTimers() {
  // setInterval wird im Hintergrund/bei gesperrtem Screen gedrosselt — beim Zurueckkommen
  // sofort anhand der absoluten Endzeit neu berechnen, statt auf den naechsten Tick zu warten.
  Object.keys(state.timers).forEach(id => { if (state.timers[id].running) tickTimer(id); });
}
function updateTimerChipDOM(id) {
  const t = state.timers[id];
  if (!t) return;
  const labelEl = document.querySelector(`[data-timer-label="${id}"]`);
  if (labelEl) labelEl.textContent = fmtClock(t.remaining);
  const chipEl = document.querySelector(`[data-timer-id="${id}"]`);
  if (chipEl) {
    chipEl.classList.toggle('running', t.running);
    chipEl.classList.toggle('done', t.done);
    if (t.done) chipEl.innerHTML = `${ICONS.check}<span data-timer-label="${id}">${fmtClock(0)}</span>`;
  }
}
function finishTimerFeedback() {
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.55);
  } catch (e) {}
  showToast('Timer fertig', 'success', true);
}

/* ---------- Cook mode: wake lock ---------- */
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      state.wakeLock = await navigator.wakeLock.request('screen');
      state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
    }
  } catch (e) { state.wakeLock = null; }
}
function releaseWakeLock() {
  if (state.wakeLock) { state.wakeLock.release().catch(() => {}); state.wakeLock = null; }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    resyncRunningTimers();
    if (state.view === 'cookmode' && !state.wakeLock) await requestWakeLock();
  }
});

/* ---------- Backup: Export / Import als JSON-Datei ---------- */
function downloadBackup() {
  const payload = {
    app: 'savora', version: 1, exportedAt: new Date().toISOString(),
    recipes: state.recipes, shopping: state.shopping,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `savora-sicherung-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast('Sicherung wird heruntergeladen');
}
async function restoreBackupFromFile(file) {
  const statusEl = document.getElementById('backupStatus');
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.recipes)) throw new Error('Diese Datei sieht nicht wie eine Savora-Sicherung aus');
    let added = 0;
    for (const r of data.recipes) {
      const clone = JSON.parse(JSON.stringify(r));
      clone.id = uid();
      clone.updatedAt = Date.now();
      await dbPut(clone);
      added++;
    }
    let addedItems = 0;
    for (const s of (data.shopping || [])) {
      const clone = JSON.parse(JSON.stringify(s));
      clone.id = uid();
      await dbPutShopping(clone);
      addedItems++;
    }
    await loadRecipes();
    await loadShopping();

  }
}

/* ---------- Web import (JSON-LD schema.org/Recipe) ---------- */
async function importFromUrl(url) {
  const statusEl = document.getElementById('importStatus');
  statusEl.innerHTML = `<div class="import-status pending">Rezept wird geladen …</div>`;
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('Seite konnte nicht geladen werden');
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const scripts = Array.from(doc.querySelectorAll('script[type="application/ld+json"]'));
    let recipeData = null;
    for (const s of scripts) {
      try {
        let json = JSON.parse(s.textContent);
        const candidates = Array.isArray(json) ? json : (json['@graph'] || [json]);
        recipeData = candidates.find(c => {
          const t = c['@type'];
          return t === 'Recipe' || (Array.isArray(t) && t.includes('Recipe'));
        });
        if (recipeData) break;
      } catch (e) { /* skip malformed block */ }
    }
    if (!recipeData) throw new Error('Auf dieser Seite wurden keine strukturierten Rezeptdaten gefunden');
    const r = emptyRecipe();
    r.title = recipeData.name || 'Importiertes Rezept';
    r.source = url;
    r.servings = parseInt(recipeData.recipeYield) || 4;
    r.timeMinutes = parseISODuration(recipeData.totalTime || recipeData.cookTime) || 30;
    r.ingredients = (recipeData.recipeIngredient || []).map(parseIngredientLine).map(i => autoConvertIngredient(i));
    const instr = recipeData.recipeInstructions;
    r.steps = Array.isArray(instr)
      ? instr.map(s => ({ text: typeof s === 'string' ? s : (s.text || s.name || '') }))
      : (typeof instr === 'string' ? instr.split(/\n+/).filter(Boolean).map(t => ({ text: t })) : [{ text: '' }]);
    if (recipeData.image) {
      r.image = Array.isArray(recipeData.image) ? recipeData.image[0] : (recipeData.image.url || recipeData.image);
    }
    await dbPut(r);
    await loadRecipes();
    statusEl.innerHTML = `<div class="import-status ok">„${escapeHtml(r.title)}" importiert.</div>`;
    setTimeout(() => { state.activeRecipeId = r.id; state.view = 'detail'; render(); }, 700);
  } catch (e) {
    statusEl.innerHTML = `<div class="import-status err">Import fehlgeschlagen: ${escapeHtml(e.message)}. Manche Seiten blockieren externe Anfragen (CORS) — trag das Rezept in diesem Fall manuell ein.</div>`;
  }
}
function parseISODuration(iso) {
  if (!iso) return null;
  const m = /PT(?:(\d+)H)?(?:(\d+)M)?/.exec(iso);
  if (!m) return null;
  return (parseInt(m[1] || 0) * 60) + parseInt(m[2] || 0);
}
function parseIngredientLine(line) {
  const m = /^([\d.,\/]+)\s*([a-zA-ZäöüÄÖÜ.]*)\s+(.*)$/.exec(line.trim());
  if (m) return { amount: m[1].replace(',', '.'), unit: m[2], name: m[3] };
  return { amount: '', unit: '', name: line };
}

/* ---------- Freitext-Import (z.B. Instagram-Bildunterschrift) ---------- */
function stripBullet(line) {
  return line.replace(/^[\s]*[-*•‣▪◦·]+\s*/, '').replace(/^[\p{Emoji_Presentation}\p{Extended_Pictographic}]\s*/u, '').trim();
}
function stripStepNumber(line) {
  return line.replace(/^\s*(schritt\s*)?\d+[\.\):]\s*/i, '').trim();
}
const STEP_NUM_RE = /^\s*(?:schritt\s*)?(\d+)[\.\):]\s+(.+)$/i;
function looksLikeIngredient(line) {
  if (STEP_NUM_RE.test(line)) return false;
  const s = stripBullet(line);
  if (!s) return false;
  return /^[\d½¼¾⅓⅔]/.test(s) || /^[-*•‣▪◦·]/.test(line) || /^[\p{Emoji_Presentation}\p{Extended_Pictographic}]/u.test(line);
}
function parseFreeTextRecipe(raw) {
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const r = emptyRecipe();
  r.source = null;

  const ingHeaderRe = /^(zutaten|ingredients?)\s*:?\s*$/i;
  const stepHeaderRe = /^(zubereitung|anleitung|schritte|steps?|instructions?)\s*:?\s*$/i;
  const metaLineRe = /portionen|personen|servings|dauert|zubereitungszeit|gesamtzeit|kochzeit/i;
  const isHashtagOnly = (l) => !l.replace(/#[\wäöüÄÖÜß-]+/g, '').trim();

  let tagWords = [];
  lines.forEach(l => {
    const tags = l.match(/#[\wäöüÄÖÜß-]+/g);
    if (tags) tagWords.push(...tags.map(t => t.replace('#', '')));
  });

  const ingStart = lines.findIndex(l => ingHeaderRe.test(l));
  const stepStart = lines.findIndex(l => stepHeaderRe.test(l));

  // Instagram-Bildunterschriften haben die Schritte meist schon nummeriert — dieses
  // Muster ist ein zuverlässiges Signal und wird unabhängig von Überschriften erkannt.
  const numberedSteps = [];
  lines.forEach((l, idx) => {
    const m = STEP_NUM_RE.exec(l);
    if (m) numberedSteps.push({ idx, num: parseInt(m[1]), text: m[2].trim() });
  });

  const titleLine = lines.find(l =>
    !isHashtagOnly(l) && !ingHeaderRe.test(l) && !stepHeaderRe.test(l) &&
    !metaLineRe.test(l) && !STEP_NUM_RE.test(l) && !looksLikeIngredient(l)
  ) || lines.find(l => !l.startsWith('#')) || null;

  let ingLines = [], stepLines = [];

  if (numberedSteps.length) {
    stepLines = numberedSteps.sort((a, b) => a.num - b.num).map(s => s.text);
    const firstStepIdx = Math.min(...numberedSteps.map(s => s.idx));
    if (ingStart !== -1) {
      const end = (stepStart !== -1 && stepStart > ingStart) ? stepStart : firstStepIdx;
      ingLines = lines.slice(ingStart + 1, Math.max(end, ingStart + 1)).filter(l => !STEP_NUM_RE.test(l));
    } else {
      ingLines = lines.slice(0, firstStepIdx).filter(l => l !== titleLine && looksLikeIngredient(l));
    }
  } else if (ingStart !== -1 || stepStart !== -1) {
    const firstSectionIdx = [ingStart, stepStart].filter(i => i !== -1).sort((a, b) => a - b)[0];
    if (ingStart !== -1) {
      const end = stepStart !== -1 && stepStart > ingStart ? stepStart : lines.length;
      ingLines = lines.slice(ingStart + 1, end);
    }
    if (stepStart !== -1) {
      const end = ingStart !== -1 && ingStart > stepStart ? ingStart : lines.length;
      stepLines = lines.slice(stepStart + 1, end).filter(l => !ingHeaderRe.test(l));
    }
  } else {
    for (const l of lines) {
      if (l === titleLine || l.startsWith('#')) continue;
      if (looksLikeIngredient(l) && l.length < 60) ingLines.push(l);
      else stepLines.push(l);
    }
  }

  ingLines = ingLines.filter(l => !metaLineRe.test(l) && !isHashtagOnly(l));
  stepLines = stepLines.filter(l => !metaLineRe.test(l) && !isHashtagOnly(l));

  r.title = titleLine ? stripBullet(titleLine).slice(0, 80) : 'Importiertes Rezept';
  r.ingredients = ingLines.map(l => parseIngredientLine(stripBullet(l))).filter(i => i.name);
  r.ingredients = r.ingredients.map(i => autoConvertIngredient(i));
  r.steps = stepLines.map(l => ({ text: stripStepNumber(stripBullet(l)) })).filter(s => s.text);
  if (!r.ingredients.length) r.ingredients = [{ amount: '', unit: '', name: '' }];
  if (!r.steps.length) r.steps = [{ text: '' }];

  const metaText = lines.filter(l => metaLineRe.test(l)).join(' ') || raw;
  const timeMatch = metaText.match(/(\d+)\s*(min(?:uten)?|std\.?|stunden?)/i) || raw.match(/(\d+)\s*(min(?:uten)?|std\.?|stunden?)/i);
  if (timeMatch) r.timeMinutes = /std|stunden/i.test(timeMatch[2]) ? parseInt(timeMatch[1]) * 60 : parseInt(timeMatch[1]);
  const servMatch = metaText.match(/(\d+)\s*(portionen|personen|servings)/i) || raw.match(/(\d+)\s*(portionen|personen|servings)/i);
  if (servMatch) r.servings = parseInt(servMatch[1]);

  const dietMap = { vegan: 'vegan', vegetarisch: 'vegetarisch', vegetarian: 'vegetarisch', glutenfrei: 'glutenfrei', laktosefrei: 'laktosefrei', nussfrei: 'nussfrei' };
  const NEGATION_WORDS = ['nicht', 'kein', 'keine', 'keinen', 'keinem', 'ohne'];
  const lowerAll = (raw + ' ' + tagWords.join(' ')).toLowerCase();
  const detectedDiet = [];
  for (const [kw, val] of Object.entries(dietMap)) {
    let searchFrom = 0, idx;
    let anyPositive = false;
    // Alle Fundstellen pruefen, nicht nur die erste — falls "vegan" mehrfach vorkommt
    // (z.B. einmal negiert, einmal nicht), zaehlt ein einziger echter Treffer.
    while ((idx = lowerAll.indexOf(kw, searchFrom)) !== -1) {
      const before = lowerAll.slice(Math.max(0, idx - 15), idx);
      const negated = NEGATION_WORDS.some(w => before.includes(w));
      if (!negated) { anyPositive = true; break; }
      searchFrom = idx + kw.length;
    }
    if (anyPositive) detectedDiet.push(val);
  }
  r.diet = Array.from(new Set(detectedDiet));
  r.tags = Array.from(new Set(tagWords.filter(t => !dietMap[t.toLowerCase()]))).slice(0, 6);
  r.notes = 'Aus eingefügtem Text importiert — bitte vor dem Speichern prüfen.';
  return r;
}

/* ---------- Toast + Live Region (Screenreader-Ansagen) ---------- */
function announceLive(msg, assertive) {
  const region = document.getElementById(assertive ? 'liveRegionAssertive' : 'liveRegion');
  if (!region) return;
  region.textContent = '';
  requestAnimationFrame(() => { region.textContent = msg; });
}
let toastTimer = null;
function showToast(msg, type = 'success', assertive = false) {
  state.toastMsg = msg;
  const existing = document.querySelector('.toast:not(.toast-undo)');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' toast-error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  announceLive(msg, assertive || type === 'error');
  clearTimeout(toastTimer);
  const duration = type === 'error' ? 5500 : type === 'info' ? 4000 : 2500;
  toastTimer = setTimeout(() => el.remove(), duration);
}

let undoState = null; // { timer, el, onExpire }
function showUndoToast(msg, onUndo, onExpire) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (undoState) { clearTimeout(undoState.timer); undoState.onExpire(); undoState = null; }
  const el = document.createElement('div');
  el.className = 'toast toast-undo';
  el.innerHTML = `<span>${escapeHtml(msg)}</span><button type="button" class="toast-undo-btn">Rückgängig</button>`;
  document.body.appendChild(el);
  announceLive(msg, false);
  const timer = setTimeout(() => { el.remove(); undoState = null; onExpire(); }, 5000);
  el.querySelector('.toast-undo-btn').addEventListener('click', () => {
    clearTimeout(timer);
    el.remove();
    undoState = null;
    onUndo();
  });
  undoState = { timer, el, onExpire };
}

/* ---------- Form data collection ---------- */
function collectFormData() {
  const r = state.editingRecipe;
  r.title = document.getElementById('f-title').value.trim() || 'Ohne Titel';
  r.servings = parseInt(document.getElementById('f-servings').value) || 1;
  r.timeMinutes = parseInt(document.getElementById('f-time').value) || 0;
  r.difficulty = document.getElementById('f-difficulty').value;
  r.notes = document.getElementById('f-notes').value;
  r.ingredients = Array.from(document.querySelectorAll('#ingRows [data-ing-row]')).map(row => ({
    amount: row.querySelector('.ing-amount-input').value.trim(),
    unit: row.querySelector('.ing-unit-input').value.trim(),
    name: row.querySelector('.ing-name-input').value.trim(),
  }));
  r.steps = Array.from(document.querySelectorAll('#stepRows [data-step-row]')).map(row => ({
    text: row.querySelector('.step-text-input').value.trim(),
  }));
  r.updatedAt = Date.now();
  return r;
}

/* ---------- Event binding ---------- */
/* ---------- Kochmodus: Navigation & Sprachausgabe ---------- */
function currentCookRecipe() { return state.recipes.find(x => x.id === state.activeRecipeId); }
function cookGoNext() {
  const r = currentCookRecipe();
  if (!r) return;
  const steps = r.steps || [];
  if (state.cookStepIndex < steps.length - 1) { state.cookStepIndex++; render(); speakCurrentStepIfEnabled(); }
}
function cookGoPrev() {
  if (state.cookStepIndex > 0) { state.cookStepIndex--; render(); speakCurrentStepIfEnabled(); }
}
function speakCurrentStepIfEnabled() {
  if (!state.voiceEnabled || !('speechSynthesis' in window)) return;
  const r = currentCookRecipe();
  if (!r) return;
  const step = (r.steps || [])[state.cookStepIndex];
  if (!step || !step.text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(step.text);
  utter.lang = 'de-DE';
  utter.rate = 0.98;
  window.speechSynthesis.speak(utter);
}
function bindCookSwipe() {
  const overlay = document.querySelector('.cookmode-overlay');
  if (!overlay) return;
  let startX = null, startY = null;
  overlay.addEventListener('touchstart', (e) => {
    if (!e.touches || !e.touches[0]) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, { passive: true });
  overlay.addEventListener('touchend', (e) => {
    if (startX === null || !e.changedTouches || !e.changedTouches[0]) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    if (dx < 0) cookGoNext(); else cookGoPrev();
  }, { passive: true });
}

let modalTriggerSelector = null;
function onModalEscape(e) {
  if (e.key === 'Escape' && state.modal) {
    e.preventDefault();
    state.modal = null;
    render();
  }
}
function bindEvents() {
  App.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });
  App.querySelectorAll('.recipe-card[role="button"]').forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onAction({ currentTarget: el }); }
    });
  });
  if (state.view === 'cookmode') bindCookSwipe();

  const modalSheet = document.querySelector('.modal-sheet');
  if (modalSheet) {
    modalSheet.focus();
    document.addEventListener('keydown', onModalEscape);
  } else {
    document.removeEventListener('keydown', onModalEscape);
  }

  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => { state.query = e.target.value; renderKeepFocus('searchInput'); });
  }
  const importUrl = document.getElementById('importUrl');
  if (importUrl) importUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') importFromUrl(importUrl.value.trim()); });

  const restoreInput = document.getElementById('restoreFileInput');
  if (restoreInput) {
    restoreInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) restoreBackupFromFile(file);
      restoreInput.value = '';
    });
  }

  const ucAmount = document.getElementById('ucAmount');
  const ucUnit = document.getElementById('ucUnit');
  const updateUc = () => {
    state.ucAmount = ucAmount.value;
    state.ucUnit = ucUnit.value;
    document.getElementById('ucResults').innerHTML = unitConverterResultsHtml();
  };
  if (ucAmount) ucAmount.addEventListener('input', updateUc);
  if (ucUnit) ucUnit.addEventListener('change', updateUc);

  const tagNew = document.getElementById('f-tag-new');
  if (tagNew) {
    tagNew.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && tagNew.value.trim()) {
        e.preventDefault();
        state.editingRecipe = collectFormData();
        if (!state.editingRecipe.tags.includes(tagNew.value.trim())) state.editingRecipe.tags.push(tagNew.value.trim());
        render();
      }
    });
  }
  const imgInput = document.getElementById('f-image');
  if (imgInput) {
    imgInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      state.editingRecipe = collectFormData();
      const raw = await fileToDataUrl(file);
      state.editingRecipe.image = await compressImage(raw);
      render();
    });
  }
}

function renderKeepFocus(id) {
  const el = document.getElementById(id);
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.getElementById(id);
  if (el2) { el2.focus(); if (pos !== null) el2.setSelectionRange(pos, pos); }
}

async function onAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action) {
    case 'new-recipe':
      state.editingRecipe = emptyRecipe();
      state.view = 'form';
      render();
      break;
    case 'edit-recipe':
      state.editingRecipe = JSON.parse(JSON.stringify(state.recipes.find(r => r.id === id)));
      state.view = 'form';
      render();
      break;
    case 'save-recipe': {
      const r = collectFormData();
      r.ingredients = r.ingredients.filter(i => i.name);
      r.steps = r.steps.filter(s => s.text);
      if (!r.ingredients.length) r.ingredients = [{ amount: '', unit: '', name: '' }];
      if (!r.steps.length) r.steps = [{ text: '' }];
      await dbPut(r);
      await loadRecipes();
      state.activeRecipeId = r.id;
      state.view = 'detail';
      render();
      showToast('Rezept gespeichert');
      break;
    }
    case 'open-recipe': {
      const cardImg = el.querySelector('.recipe-card-img');
      if (cardImg) cardImg.style.viewTransitionName = 'recipe-hero-img';
      state.activeRecipeId = id;
      state.view = 'detail';
      window.scrollTo(0, 0);
      render();
      break;
    }
    case 'back':
      state.modal = null;
      state.view = (state.view === 'form' && state.activeRecipeId) ? 'detail'
        : state.view === 'unitconverter' ? 'settings'
        : 'home';
      render();
      break;
    case 'toggle-fav': {
      e.stopPropagation();
      const r = state.recipes.find(x => x.id === id);
      r.favorite = !r.favorite;
      await dbPut(r);
      render();
      break;
    }
    case 'filter-tag':
      state.activeTag = el.dataset.tag || null;
      render();
      break;
    case 'toggle-fav-filter':
      state.favOnly = !state.favOnly;
      render();
      break;
    case 'confirm-delete':
      modalTriggerSelector = `[data-action="confirm-delete"][data-id="${id}"]`;
      state.modal = { type: 'delete', recipeId: id };
      render();
      break;
    case 'close-modal': {
      state.modal = null;
      render();
      const trigger = modalTriggerSelector && document.querySelector(modalTriggerSelector);
      if (trigger) trigger.focus();
      modalTriggerSelector = null;
      break;
    }
    case 'delete-recipe': {
      const recipeToDelete = state.recipes.find(x => x.id === id);
      if (!recipeToDelete) break;
      state.recipes = state.recipes.filter(x => x.id !== id);
      state.modal = null;
      state.view = 'home';
      render();
      showUndoToast(
        `„${recipeToDelete.title}" gelöscht`,
        () => { state.recipes.push(recipeToDelete); state.recipes.sort((a, b) => b.updatedAt - a.updatedAt); render(); },
        async () => { await dbDelete(id); }
      );
      break;
    }
    case 'add-ingredient':
      state.editingRecipe = collectFormData();
      state.editingRecipe.ingredients.push({ amount: '', unit: '', name: '' });
      render();
      break;
    case 'remove-ingredient':
      state.editingRecipe = collectFormData();
      state.editingRecipe.ingredients.splice(parseInt(el.dataset.idx), 1);
      if (!state.editingRecipe.ingredients.length) state.editingRecipe.ingredients.push({ amount: '', unit: '', name: '' });
      render();
      break;
    case 'add-step':
      state.editingRecipe = collectFormData();
      state.editingRecipe.steps.push({ text: '' });
      render();
      break;
    case 'remove-step':
      state.editingRecipe = collectFormData();
      state.editingRecipe.steps.splice(parseInt(el.dataset.idx), 1);
      if (!state.editingRecipe.steps.length) state.editingRecipe.steps.push({ text: '' });
      render();
      break;
    case 'remove-tag':
      state.editingRecipe = collectFormData();
      state.editingRecipe.tags = state.editingRecipe.tags.filter(t => t !== el.dataset.tag);
      render();
      break;
    case 'toggle-diet': {
      state.editingRecipe = collectFormData();
      const dk = el.dataset.diet;
      state.editingRecipe.diet = state.editingRecipe.diet || [];
      if (state.editingRecipe.diet.includes(dk)) {
        state.editingRecipe.diet = state.editingRecipe.diet.filter(x => x !== dk);
      } else {
        state.editingRecipe.diet.push(dk);
      }
      render();
      break;
    }
    case 'serv-inc': case 'serv-dec': {
      const r = state.recipes.find(x => x.id === id);
      const current = state.servingsOverride[id] || r.lastServings || r.servings || 1;
      const next = Math.max(1, current + (action === 'serv-inc' ? 1 : -1));
      state.servingsOverride[id] = next;
      r.lastServings = next;
      await dbPut(r);
      render();
      break;
    }
    case 'start-cook':
      state.activeRecipeId = id;
      state.cookStepIndex = 0;
      state.cookFinished = false;
      state.view = 'cookmode';
      render();
      speakCurrentStepIfEnabled();
      await requestWakeLock();
      break;
    case 'toggle-voice':
      state.voiceEnabled = !state.voiceEnabled;
      if (!state.voiceEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
      render();
      if (state.voiceEnabled) speakCurrentStepIfEnabled();
      break;
    case 'cook-next':
      cookGoNext();
      break;
    case 'cook-prev':
      cookGoPrev();
      break;
    case 'cook-finish':
      state.cookFinished = true;
      render();
      break;
    case 'exit-cook':
      releaseWakeLock();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      Object.values(state.timers).forEach(t => { if (t.intervalId) clearInterval(t.intervalId); });
      state.timers = {};
      state.cookFinished = false;
      state.view = 'detail';
      render();
      break;
    case 'toggle-timer': {
      const id = el.dataset.timerId;
      const seconds = parseInt(el.dataset.seconds);
      const t = state.timers[id];
      if (!t || (!t.running && !t.done)) startTimer(id, seconds);
      else if (t.done) { delete state.timers[id]; render(); }
      break;
    }
    case 'export-pdf':
      exportSinglePdf(id);
      break;
    case 'export-cookbook':
      exportCookbookPdf();
      break;
    case 'export-backup':
      downloadBackup();
      break;
    case 'trigger-restore':
      document.getElementById('restoreFileInput').click();
      break;
    case 'open-settings':
      state.view = 'settings';
      render();
      break;
    case 'nav-tab':
      state.view = el.dataset.view;
      render();
      break;
    case 'toggle-settings-section': {
      const key = el.dataset.key;
      const nowOpen = !state.settingsOpen.has(key);
      if (nowOpen) state.settingsOpen.add(key); else state.settingsOpen.delete(key);
      const body = document.getElementById('sec-' + key);
      if (body) { body.classList.toggle('open', nowOpen); body.toggleAttribute('hidden', !nowOpen); }
      el.classList.toggle('open', nowOpen);
      el.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
      return; // kein Re-Render — bewahrt unbestätigte Eingaben in anderen Feldern
    }
    case 'open-shopping':
      state.view = 'shopping';
      render();
      break;
    case 'open-mealplan':
      state.view = 'mealplan';
      render();
      break;
    case 'week-prev':
      state.weekStart = addDays(state.weekStart, -7);
      render();
      break;
    case 'week-next':
      state.weekStart = addDays(state.weekStart, 7);
      render();
      break;
    case 'open-day-picker':
      modalTriggerSelector = `[data-action="open-day-picker"][data-date="${el.dataset.date}"]`;
      state.modal = { type: 'pick-recipe', date: el.dataset.date };
      render();
      break;
    case 'assign-mealplan-recipe': {
      const date = el.dataset.date;
      const rid = el.dataset.id;
      const list = state.mealplan[date] || [];
      if (!list.includes(rid)) list.push(rid);
      state.mealplan[date] = list;
      await dbPutMealplanDay({ date, recipeIds: list });
      state.modal = null;
      render();
      const trigger = modalTriggerSelector && document.querySelector(modalTriggerSelector);
      if (trigger) trigger.focus();
      modalTriggerSelector = null;
      break;
    }
    case 'remove-mealplan-recipe': {
      const date = el.dataset.date;
      const rid = el.dataset.id;
      const list = (state.mealplan[date] || []).filter(x => x !== rid);
      state.mealplan[date] = list;
      await dbPutMealplanDay({ date, recipeIds: list });
      render();
      break;
    }
    case 'mealplan-to-shopping': {
      const days = Array.from({ length: 7 }, (_, i) => addDays(state.weekStart, i));
      const ids = new Set();
      days.forEach(d => (state.mealplan[fmtDateKey(d)] || []).forEach(rid => ids.add(rid)));
      for (const rid of ids) {
        const r = state.recipes.find(x => x.id === rid);
        if (r) await addRecipeIngredientsToShopping(r, r.servings || 1);
      }
      await loadShopping();
      showToast(ids.size ? 'Einkaufsliste aktualisiert' : 'Keine Rezepte in dieser Woche');
      render();
      break;
    }
    case 'add-to-shopping': {
      const r = state.recipes.find(x => x.id === id);
      const servings = state.servingsOverride[id] || r.lastServings || r.servings || 1;
      await addRecipeIngredientsToShopping(r, servings);
      await loadShopping();
      showToast('Zur Einkaufsliste hinzugefügt');
      render();
      break;
    }
    case 'toggle-shopping-item': {
      const item = state.shopping.find(s => s.id === id);
      item.checked = !item.checked;
      await dbPutShopping(item);
      render();
      break;
    }
    case 'delete-shopping-item':
      await dbDeleteShopping(id);
      await loadShopping();
      render();
      break;
    case 'clear-checked-shopping':
      for (const i of state.shopping.filter(s => s.checked)) await dbDeleteShopping(i.id);
      await loadShopping();
      render();
      break;
    case 'clear-all-shopping':
      for (const i of state.shopping) await dbDeleteShopping(i.id);
      await loadShopping();
      render();
      break;
    case 'set-theme': {
      const nextTheme = el.dataset.theme;
      const applyThemeChange = () => {
        state.theme = nextTheme;
        localStorage.setItem(THEME_KEY, state.theme);
        applyTheme();
        render();
      };
      if (document.startViewTransition && !prefersReducedMotion()) {
        const x = e.clientX, y = e.clientY;
        const endRadius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
        document.documentElement.classList.add('theme-transitioning');
        const transition = document.startViewTransition(applyThemeChange);
        transition.ready.then(() => {
          document.documentElement.animate(
            { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${endRadius}px at ${x}px ${y}px)`] },
            { duration: 550, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' }
          );
        });
        transition.finished.then(() => document.documentElement.classList.remove('theme-transitioning'));
      } else {
        applyThemeChange();
      }
      break;
    }
    case 'set-unit-system':
      state.unitSystem = el.dataset.system;
      localStorage.setItem(UNIT_KEY, state.unitSystem);
      render();
      break;
    case 'open-unitconverter':
      state.view = 'unitconverter';
      render();
      break;
    case 'convert-ingredient-row': {
      state.editingRecipe = collectFormData();
      const idx = parseInt(el.dataset.idx);
      const ing = state.editingRecipe.ingredients[idx];
      const converted = autoConvertIngredient(ing);
      if (converted === ing || (converted.amount === ing.amount && converted.unit === ing.unit)) {
        showToast('Einheit ist bereits passend oder nicht umrechenbar');
      } else {
        state.editingRecipe.ingredients[idx] = converted;
      }
      render();
      break;
    }
    case 'do-import': {
      const url = document.getElementById('importUrl').value.trim();
      if (url) importFromUrl(url);
      break;
    }
    case 'do-paste-import': {
      const text = document.getElementById('pasteText').value.trim();
      if (!text) { showToast('Bitte zuerst Text einfügen'); break; }
      state.editingRecipe = parseFreeTextRecipe(text);
      state.view = 'form';
      render();
      showToast('Entwurf erstellt — bitte prüfen');
      break;
    }
  }
}

/* ---------- Init ---------- */
function renderStorageError(err) {
  const splash = document.getElementById('splash');
  if (splash) splash.remove();
  App.innerHTML = `
    <div class="topbar"><div class="topbar-left"><div class="brand"><img src="icon-96.png" alt="Savora" class="brand-logo"><span class="brand-name">Savora</span></div></div></div>
    <main style="display:flex;align-items:center;justify-content:center;min-height:70vh;">
      <div class="empty-state" style="max-width:340px;">
        ${ICONS.trash}
        <h2>Speicher konnte nicht geöffnet werden</h2>
        <p>${escapeHtml(err && err.message ? err.message : 'Unbekannter Speicherfehler.')} Das passiert z.B. im privaten Browserfenster oder wenn der Gerätespeicher knapp ist. Deine bereits gespeicherten Rezepte sind davon nicht betroffen.</p>
        <button class="primary-btn" data-action="retry-init">${ICONS.swap} Erneut versuchen</button>
      </div>
    </main>
  `;
  document.querySelectorAll('[data-action="retry-init"]').forEach(el => el.addEventListener('click', () => location.reload()));
}

/* ---------- Kontrollierter Service-Worker-Update-Flow ---------- */
function showUpdateBanner(registration) {
  const existing = document.getElementById('updateBanner');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'updateBanner';
  el.className = 'toast toast-undo';
  el.innerHTML = `<span>Neue Version verfügbar</span><button type="button" class="toast-undo-btn">Aktualisieren</button>`;
  document.body.appendChild(el);
  el.querySelector('.toast-undo-btn').addEventListener('click', () => {
    if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
  });
}
function registerServiceWorkerWithUpdatePrompt() {
  navigator.serviceWorker.register('sw.js').then((registration) => {
    // Falls beim Laden bereits ein Worker wartet (z.B. Tab war offen, waehrend ein
    // Update installiert wurde).
    if (registration.waiting && navigator.serviceWorker.controller) showUpdateBanner(registration);

    registration.addEventListener('updatefound', () => {
      const newWorker = registration.installing;
      if (!newWorker) return;
      newWorker.addEventListener('statechange', () => {
        // "installed" + bereits ein aktiver Controller vorhanden = echtes Update,
        // nicht die allererste Installation (dafuer gaebe es noch keinen Controller).
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdateBanner(registration);
        }
      });
    });
  }).catch(() => {});

  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}

(async function init() {
  try {
    await loadRecipes();
    await loadShopping();
    await loadMealplan();
    render();
    if ('serviceWorker' in navigator) {
      registerServiceWorkerWithUpdatePrompt();
    }
    runSplashSequence();
  } catch (err) {
    console.error('Savora Initialisierungsfehler:', err);
    renderStorageError(err);
  }
})();

/* ---------- Splash-Übergang: Logo morpht in den Header ---------- */
function runSplashSequence() {
  const splash = document.getElementById('splash');
  const splashLogo = document.getElementById('splashLogo');
  const wordEl = document.querySelector('.splash-word');
  if (!splash || !splashLogo) return;

  requestAnimationFrame(() => { if (wordEl) wordEl.classList.add('show'); });

  function morphIntoHeader() {
    const target = document.querySelector('.brand-logo');
    if (!target) { setTimeout(morphIntoHeader, 50); return; }
    const t = target.getBoundingClientRect();
    const s = splashLogo.getBoundingClientRect();
    if (!t.width || !s.width) { setTimeout(morphIntoHeader, 50); return; }
    const scale = t.width / s.width;
    const dx = (t.left + t.width / 2) - (s.left + s.width / 2);
    const dy = (t.top + t.height / 2) - (s.top + s.height / 2);
    splashLogo.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    splashLogo.style.borderRadius = getComputedStyle(target).borderRadius;
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 720);
  }
  setTimeout(morphIntoHeader, 850);
}
